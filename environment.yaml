name: ai-robo-advisor
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.0
  - pip=25.1
  - numpy=2.3.0
  - pandas=2.3.0
  - scikit-learn=1.6.1
  - matplotlib=3.10.3
  - seaborn=0.12.2
  - plotly=6.1.2
  - streamlit=1.46.0
  - yfinance=0.2.28
  - python-dotenv=1.1.0
  - cvxopt=1.3.2
  - joblib=1.4.2
  - requests=2.32.4
  - beautifulsoup4=4.12.3
  - lxml=5.1.0
  - html5lib=1.1
  - streamlit-chat=0.1.1
  - pip:
    - torch --index-url https://download.pytorch.org/whl/cu126
    - torchvision --index-url https://download.pytorch.org/whl/cu126
    - torchaudio --index-url https://download.pytorch.org/whl/cu126
    - langchain==0.3.7
    - openai==1.54.4
    - dash==2.18.2
    - dash-bootstrap-components==1.6.0
    - bz2file==0.98
    - transformers==4.52.4
    - tokenizers==0.21.1
    - huggingface_hub==0.33.0
description: >
  Conda environment for the AI-Powered Robo-Advisor project.
  This environment includes all dependencies for data processing,
  machine learning model training, reinforcement learning with PyTorch,
  and the Streamlit dashboard deployment.